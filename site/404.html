<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>404 — prelaps</title>

<!-- 색인 대상이 아니다. canonical 을 달면 없는 주소를 자기 자신이라고 선언하는 셈이 된다.
     follow 는 남겨 둔다 — 아래 링크를 타고 살아 있는 페이지로 가라는 뜻이다. -->
<meta name="robots" content="noindex, follow">

<!-- 어느 언어의 없는 주소로도 떨어질 수 있어서 세 언어를 나란히 적는다.
     hreflang 은 달지 않는다. 이 페이지는 언어판이 아니라 한 장짜리 안내다. -->
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1b1b1a; --fg-muted:#6b6b66; --accent:#2a4a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e9e9e6; --fg-muted:#9a9a94; --accent:#7ba7e8; }
  }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg); text-align: center; padding: 20px;
    font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo",
          "Noto Sans KR", "Hiragino Sans", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--fg-muted); margin: 0 0 6px; }
  nav { margin-top: 18px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>

<main>
  <h1>404</h1>
  <p>그 주소에는 아무것도 없습니다.</p>
  <p>There is nothing at that address.</p>
  <p>そのアドレスには何もありません。</p>
  <nav>
    <!-- 이 페이지만은 절대 경로다. 없는 주소는 깊이가 제각각이라
         (/imagesquish/foo/bar 로도 떨어진다) 상대 경로가 어디로 풀릴지 알 수 없다.
         접두사(/imagesquish)를 빠뜨리면 허브로 나가버리므로 반드시 같이 적는다. -->
    <a href="/imagesquish/ko/" hreflang="ko">한국어</a>
    <a href="/imagesquish/en/" hreflang="en">English</a>
    <a href="/imagesquish/ja/" hreflang="ja">日本語</a>
    <a href="/">prelaps</a>
  </nav>
</main>

</body>
</html>
